# Render Blueprint Infrastructure as Code for LifeDrop
# This defines both the PostgreSQL Database and the Express Web API Service
# See: https://render.com/docs/blueprint-spec

version: "1"

services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: lifedrop-api
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lifedrop-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
        # e.g., https://lifedrop.vercel.app
      - key: CORS_ORIGINS
        sync: false
        # e.g., https://lifedrop.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: 7
      - key: ADMIN_PASSKEY_PIN
        sync: false
        # e.g., 901234
      - key: SMS_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: info

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: lifedrop-db
    databaseName: lifedrop
    user: lifedrop_user
    plan: free
    region: oregon
    ipAllowList: [] # Kept private to internal Render services by default
